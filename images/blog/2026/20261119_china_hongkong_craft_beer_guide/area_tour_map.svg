<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 740" class="w-full h-auto rounded-2xl shadow-xl overflow-hidden font-sans select-none" style="background: linear-gradient(145deg, #090e17 0%, #0f172a 100%);">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="card-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Subtle Lat/Lon Grid -->
  <g stroke="#1e293b" stroke-width="1" stroke-dasharray="4,6" opacity="0.6">
    <line x1="80" y1="152" x2="1120" y2="152" />
    <line x1="80" y1="272" x2="1120" y2="272" />
    <line x1="80" y1="392" x2="1120" y2="392" />
    <line x1="80" y1="512" x2="1120" y2="512" />
    <line x1="80" y1="632" x2="1120" y2="632" />
    <line x1="265" y1="60" x2="265" y2="700" />
    <line x1="475" y1="60" x2="475" y2="700" />
    <line x1="685" y1="60" x2="685" y2="700" />
    <line x1="895" y1="60" x2="895" y2="700" />
  </g>

  <!-- Simplified Stylized China Coastline & Landmass Silhouette -->
  <path d="M120,110 L260,85 L440,95 L590,80 L760,95 L825,140 L805,175 L845,210 L895,215 L840,260 L875,310 L928,358 L920,395 L885,435 L845,490 L790,540 L725,568 L665,585 L625,575 L580,595 L540,615 L495,595 L410,605 L320,575 L230,520 L165,435 L130,310 L110,200 Z"
        fill="#162032" stroke="#293952" stroke-width="1.5" fill-opacity="0.72" />
  <!-- Hainan Island -->
  <path d="M495,638 C515,628 538,632 540,650 C542,665 518,676 500,668 C488,660 486,645 495,638 Z"
        fill="#162032" stroke="#293952" stroke-width="1.5" fill-opacity="0.8" />
  <!-- Taiwan Reference Silhouette (faded) -->
  <path d="M878,510 C892,505 898,530 890,565 C882,585 868,578 867,550 C866,525 870,514 878,510 Z"
        fill="#162032" stroke="#233146" stroke-width="1" fill-opacity="0.35" />

  <!-- Title / Header Card -->
  <g transform="translate(28, 24)">
    <rect x="0" y="0" width="440" height="68" rx="12" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1.2" filter="url(#card-shadow)" />
    <text x="18" y="28" fill="#f8fafc" font-size="16" font-weight="800" letter-spacing="0.5">中国・香港 クラフトビール周遊エリアマップ</text>
    <text x="18" y="50" fill="#94a3b8" font-size="12" font-weight="500">本土Top50＋香港19軒（2026年11月時点 Untappdデータ）</text>
  </g>

  <!-- 4 Tour Area Highlight Halos -->
  <!-- Area 3: North (Beijing - Tianjin - Shijiazhuang) -->
  <ellipse cx="722" cy="175" rx="92" ry="52" fill="#38bdf8" fill-opacity="0.10" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="5,4" />
  <!-- Area 2: East (Yangtze River Delta) -->
  <ellipse cx="865" cy="364" rx="78" ry="52" fill="#34d399" fill-opacity="0.10" stroke="#34d399" stroke-width="1.5" stroke-dasharray="5,4" />
  <!-- Area 4: Inland (Xi'an - Chengdu - Chongqing - Wuhan) -->
  <path d="M275,380 C275,320 430,255 510,265 C580,275 695,335 695,385 C695,425 460,445 365,435 C300,428 275,410 275,380 Z"
        fill="#c084fc" fill-opacity="0.09" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="5,4" />
  <!-- Area 1: South Bay + Changsha -->
  <path d="M580,420 C615,400 665,425 685,530 C700,590 675,610 635,605 C595,600 570,550 580,420 Z"
        fill="#fbbf24" fill-opacity="0.10" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="5,4" />

  <!-- High-Speed Rail Route Lines -->
  <!-- Area 1 HSR -->
  <g stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" opacity="0.85">
    <line x1="657" y1="577" x2="654" y2="572" />
    <line x1="654" y1="572" x2="626" y2="558" />
    <line x1="626" y1="558" x2="612" y2="435" stroke-dasharray="6,4" />
  </g>
  <!-- Area 2 HSR -->
  <g stroke="#34d399" stroke-width="2.2" stroke-linecap="round" opacity="0.85">
    <line x1="913" y1="363" x2="867" y2="385" />
    <line x1="913" y1="363" x2="818" y2="342" />
    <line x1="818" y1="342" x2="839" y2="334" />
    <line x1="867" y1="385" x2="881" y2="392" />
  </g>
  <!-- Area 3 HSR -->
  <g stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.85">
    <line x1="734" y1="154" x2="762" y2="174" />
    <line x1="734" y1="154" x2="668" y2="200" stroke-dasharray="6,4" />
  </g>
  <!-- Area 4 HSR -->
  <g stroke="#c084fc" stroke-width="2.2" stroke-linecap="round" opacity="0.85">
    <line x1="472" y1="289" x2="304" y2="375" />
    <line x1="304" y1="375" x2="388" y2="402" />
    <line x1="388" y1="402" x2="661" y2="378" stroke-dasharray="6,4" />
  </g>

  <!-- Area 3 Nodes (North: Sky Blue #38bdf8) -->
  <g filter="url(#glow)">
    <circle cx="734" cy="154" r="9" fill="#38bdf8" stroke="#0f172a" stroke-width="2" />
    <circle cx="762" cy="174" r="6" fill="#38bdf8" stroke="#0f172a" stroke-width="1.5" />
    <circle cx="668" cy="200" r="6" fill="#38bdf8" stroke="#0f172a" stroke-width="1.5" />
  </g>
  <g font-size="12" font-weight="700" fill="#e0f2fe">
    <text x="748" y="150">北京 (11軒)</text>
    <text x="774" y="182" font-size="11">天津 (2)</text>
    <text x="598" y="216" font-size="11">石家荘 (1)</text>
    <text x="720" y="210" fill="#7dd3fc" font-size="10.5" font-weight="600">約30分〜1.5h</text>
  </g>

  <!-- Area 2 Nodes (East: Emerald #34d399) -->
  <g filter="url(#glow)">
    <circle cx="913" cy="363" r="8.5" fill="#34d399" stroke="#0f172a" stroke-width="2" />
    <circle cx="867" cy="385" r="6.5" fill="#34d399" stroke="#0f172a" stroke-width="1.5" />
    <circle cx="888" cy="373" r="4.5" fill="#34d399" stroke="#0f172a" stroke-width="1" />
    <circle cx="881" cy="392" r="4.5" fill="#34d399" stroke="#0f172a" stroke-width="1" />
    <circle cx="818" cy="342" r="5" fill="#34d399" stroke="#0f172a" stroke-width="1.5" />
    <circle cx="839" cy="334" r="5" fill="#34d399" stroke="#0f172a" stroke-width="1.5" />
  </g>
  <g font-size="12" font-weight="700" fill="#d1fae5">
    <text x="928" y="366">上海 (8軒)</text>
    <text x="886" y="407" font-size="11">杭州(3)・嘉興(1)・紹興(1)</text>
    <text x="805" y="324" font-size="11">南京(1)・揚州(1)</text>
  </g>

  <!-- Area 4 Nodes (Inland: Purple #c084fc) -->
  <g filter="url(#glow)">
    <circle cx="472" cy="289" r="6.5" fill="#c084fc" stroke="#0f172a" stroke-width="1.5" />
    <circle cx="304" cy="375" r="6" fill="#c084fc" stroke="#0f172a" stroke-width="1.5" />
    <circle cx="388" cy="402" r="5.5" fill="#c084fc" stroke="#0f172a" stroke-width="1.5" />
    <circle cx="661" cy="378" r="6" fill="#c084fc" stroke="#0f172a" stroke-width="1.5" />
  </g>
  <g font-size="12" font-weight="700" fill="#f3e8ff">
    <text x="484" y="286">西安 (3軒)</text>
    <text x="242" y="370">成都 (2軒)</text>
    <text x="394" y="418" font-size="11">重慶 (1)</text>
    <text x="673" y="382" font-size="11">武漢 (2)</text>
    <text x="355" y="330" fill="#d8b4fe" font-size="10.5" font-weight="600">約3.5〜4h</text>
  </g>

  <!-- Area 1 Nodes (South Bay + Changsha: Amber #fbbf24) -->
  <g filter="url(#glow)">
    <circle cx="657" cy="577" r="10" fill="#fbbf24" stroke="#0f172a" stroke-width="2" />
    <circle cx="654" cy="572" r="5" fill="#f59e0b" stroke="#0f172a" stroke-width="1.2" />
    <circle cx="626" cy="558" r="7" fill="#fbbf24" stroke="#0f172a" stroke-width="1.5" />
    <circle cx="612" cy="435" r="6" fill="#fbbf24" stroke="#0f172a" stroke-width="1.5" />
  </g>
  <g font-size="12" font-weight="700" fill="#fef3c7">
    <text x="674" y="592">香港 (18+1軒)</text>
    <text x="668" y="571" font-size="11">深圳 (1)</text>
    <text x="562" y="553">広州 (4軒)</text>
    <text x="550" y="438" font-size="11">長沙 (1・本土#1)</text>
    <text x="630" y="500" fill="#fcd34d" font-size="10.5" font-weight="600">約2.5h</text>
  </g>

  <!-- Other Notable Regional Cities (Coral #fb7185) -->
  <g filter="url(#glow)">
    <circle cx="570" cy="133" r="5" fill="#fb7185" stroke="#0f172a" stroke-width="1.2" />
    <circle cx="766" cy="349" r="5" fill="#fb7185" stroke="#0f172a" stroke-width="1.2" />
    <circle cx="804" cy="361" r="4.5" fill="#fb7185" stroke="#0f172a" stroke-width="1.2" />
    <circle cx="395" cy="474" r="5" fill="#fb7185" stroke="#0f172a" stroke-width="1.2" />
    <circle cx="521" cy="505" r="5" fill="#fb7185" stroke="#0f172a" stroke-width="1.2" />
    <circle cx="794" cy="524" r="5" fill="#fb7185" stroke="#0f172a" stroke-width="1.2" />
    <circle cx="517" cy="644" r="5.5" fill="#fb7185" stroke="#0f172a" stroke-width="1.2" />
  </g>
  <g font-size="11" font-weight="600" fill="#ffe4e6">
    <text x="485" y="128">フフホト (1)</text>
    <text x="720" y="346">合肥 (1)</text>
    <text x="742" y="366" font-size="10.5">蕪湖 (1)</text>
    <text x="342" y="488">貴陽 (1)</text>
    <text x="468" y="518">桂林 (1)</text>
    <text x="804" y="528">廈門 (1)</text>
    <text x="530" y="655">海南 (1)</text>
  </g>

  <!-- Legend Card (Bottom Left) -->
  <g transform="translate(28, 535)">
    <rect x="0" y="0" width="335" height="175" rx="12" fill="#1e293b" fill-opacity="0.92" stroke="#334155" stroke-width="1.2" filter="url(#card-shadow)" />
    <text x="16" y="25" fill="#f8fafc" font-size="13" font-weight="700">4大周遊エリア ＆ 凡例</text>

    <circle cx="24" cy="48" r="6" fill="#fbbf24" />
    <text x="38" y="52" fill="#fef3c7" font-size="11.5" font-weight="600">① 華南ベイエリア（香港・深圳・広州＋長沙）</text>

    <circle cx="24" cy="73" r="6" fill="#34d399" />
    <text x="38" y="77" fill="#d1fae5" font-size="11.5" font-weight="600">② 華東・長江デルタ（上海・杭州・南京等）</text>

    <circle cx="24" cy="98" r="6" fill="#38bdf8" />
    <text x="38" y="102" fill="#e0f2fe" font-size="11.5" font-weight="600">③ 華北・京津（北京・天津＋石家荘）</text>

    <circle cx="24" cy="123" r="6" fill="#c084fc" />
    <text x="38" y="127" fill="#f3e8ff" font-size="11.5" font-weight="600">④ 内陸グルメ＆ディープ（西安・成都・重慶＋武漢）</text>

    <circle cx="24" cy="148" r="5" fill="#fb7185" />
    <text x="38" y="152" fill="#ffe4e6" font-size="11.5" font-weight="600">エリア外の注目地方都市（高鉄ルートは実線/破線）</text>
  </g>
</svg>
